name: Generate App Configs

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  generate-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Create Config Files
        run: |
          mkdir -p apps/{apkmirror,apkpure,uptodown}

          # Use jq to create JSON configs
          jq -n --arg org disney --arg name disney-plus --arg pkg com.disney.disneyplus '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/disney-plus.json
          jq -n --arg org facebook-2 --arg name facebook --arg pkg com.facebook.katana '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/facebook.json
          jq -n --arg org duolingo --arg name duolingo --arg pkg com.duolingo '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/duolingo.json
          jq -n --arg org google-inc --arg name google-news --arg pkg com.google.android.apps.magazines '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/google-news.json
          jq -n --arg org facebook-2 --arg name messenger --arg pkg com.facebook.orca '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/messenger.json
          jq -n --arg org adobe --arg name lightroom --arg pkg com.adobe.lrmobile '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/lightroom.json
          jq -n --arg org amazon-com --arg name amazon-prime-video --arg pkg com.amazon.avod.thirdpartyclient '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/prime-video.json
          jq -n --arg org proton-technologies --arg name proton-mail --arg pkg ch.protonmail.android '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/proton-mail.json
          jq -n --arg org proton-technologies --arg name protonvpn --arg pkg ch.protonvpn.android '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/proton-vpn.json
          jq -n --arg org spotify-ltd --arg name spotify --arg pkg com.spotify.music '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/spotify.json
          jq -n --arg org twitch-interactive --arg name twitch --arg pkg tv.twitch.android.app '{org:$org,name:$name,type:"APK",arch:"universal",dpi:"nodpi",package:$pkg,version:""}' > apps/apkmirror/twitch.json

          # APKPure configs (simpler format)
          jq -n --arg name disney-plus --arg pkg com.disney.disneyplus '{name:$name,package:$pkg,version:""}' > apps/apkpure/disney-plus.json
          jq -n --arg name facebook --arg pkg com.facebook.katana '{name:$name,package:$pkg,version:""}' > apps/apkpure/facebook.json
          jq -n --arg name google-news --arg pkg com.google.android.apps.magazines '{name:$name,package:$pkg,version:""}' > apps/apkpure/google-news.json
          jq -n --arg name prime-video --arg pkg com.amazon.avod.thirdpartyclient '{name:$name,package:$pkg,version:""}' > apps/apkpure/prime-video.json
          jq -n --arg name proton-mail --arg pkg ch.protonmail.android '{name:$name,package:$pkg,version:""}' > apps/apkpure/proton-mail.json
          jq -n --arg name proton-vpn --arg pkg ch.protonvpn.android '{name:$name,package:$pkg,version:""}' > apps/apkpure/proton-vpn.json
          jq -n --arg name spotify --arg pkg com.spotify.music '{name:$name,package:$pkg,version:""}' > apps/apkpure/spotify.json

          # Uptodown configs
          jq -n --arg name disney-plus --arg pkg com.disney.disneyplus '{name:$name,package:$pkg,version:""}' > apps/uptodown/disney-plus.json
          jq -n --arg name facebook --arg pkg com.facebook.katana '{name:$name,package:$pkg,version:""}' > apps/uptodown/facebook.json
          jq -n --arg name google-news --arg pkg com.google.android.apps.magazines '{name:$name,package:$pkg,version:""}' > apps/uptodown/google-news.json
          jq -n --arg name messenger --arg pkg com.facebook.orca '{name:$name,package:$pkg,version:""}' > apps/uptodown/messenger.json
          jq -n --arg name prime-video --arg pkg com.amazon.avod.thirdpartyclient '{name:$name,package:$pkg,version:""}' > apps/uptodown/prime-video.json
          jq -n --arg name proton-mail --arg pkg ch.protonmail.android '{name:$name,package:$pkg,version:""}' > apps/uptodown/proton-mail.json
          jq -n --arg name proton-vpn --arg pkg ch.protonvpn.android '{name:$name,package:$pkg,version:""}' > apps/uptodown/proton-vpn.json
          jq -n --arg name spotify --arg pkg com.spotify.music '{name:$name,package:$pkg,version:""}' > apps/uptodown/spotify.json
          jq -n --arg name twitch --arg pkg tv.twitch.android.app '{name:$name,package:$pkg,version:""}' > apps/uptodown/twitch.json

          echo "✅ Configs created for 17 apps"
          ls -la apps/apkmirror/*.json apps/apkpure/*.json apps/uptodown/*.json | wc -l

      - name: Commit Configs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add apps/
          git commit -m "Add configs for 17 new apps" || echo "No changes to commit"
          git remote set-url --push origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:${GITHUB_REF_NAME}
